apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-backend
  namespace: cloudops
  labels:
    app: cloudops-backend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: cloudops-backend

  template:
    metadata:
      labels:
        app: cloudops-backend

    spec:
      containers:
        - name: backend
          image: 216453078762.dkr.ecr.ap-south-1.amazonaws.com/cloudops-backend:11
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: cloudops-backend-config
            - secretRef:
                name: cloudops-backend-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
               drop:
                 - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: tmp
          emptyDir: {}