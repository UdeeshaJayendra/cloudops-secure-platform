apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloudops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    scrape_configs:
      - job_name: "cloudops-backend"
        metrics_path: /metrics
        static_configs:
          - targets:
              - cloudops-backend:3000

  alerts.yml: |
    groups:
      - name: cloudops-backend
        rules:
          - alert: CloudOpsBackendDown
            expr: up{job="cloudops-backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "CloudOps backend is down"
              description: "Prometheus cannot scrape the CloudOps backend for more than 1 minute."

          - alert: CloudOpsBackendHigh5xxRate
            expr: |
              sum(rate(cloudops_http_requests_total{status_code=~"5.."}[5m]))
              /
              sum(rate(cloudops_http_requests_total[5m])) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High CloudOps backend 5xx error rate"
              description: "More than 5% of backend requests have returned HTTP 5xx responses for 2 minutes."