apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloudops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "cloudops-backend"
        metrics_path: /metrics
        static_configs:
          - targets:
              - cloudops-backend:3000